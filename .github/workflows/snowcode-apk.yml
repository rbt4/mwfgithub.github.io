name: Build SnowCode APK

on:
  push:
    branches:
      - snowcode-apk-build
      - snowcode-apk-v04
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Rebuild Android source archive
        shell: bash
        run: |
          if [ -d snowcode-apk-v04 ]; then
            cat snowcode-apk-v04/v04.part00 snowcode-apk-v04/v04.part01 snowcode-apk-v04/v04.part02 snowcode-apk-v04/v04.part03 snowcode-apk-v04/v04.part04a snowcode-apk-v04/v04.part04b snowcode-apk-v04/v04.part05a snowcode-apk-v04/v04.part05b snowcode-apk-v04/v04.part06a snowcode-apk-v04/v04.part06b > /tmp/snowcode.b64
          else
            cat snowcode-apk/source.part* > /tmp/snowcode.b64
          fi
          tr -d '\n\r ' < /tmp/snowcode.b64 > /tmp/snowcode-clean.b64
          base64 -d /tmp/snowcode-clean.b64 > /tmp/SnowCodeAndroid-src.zip
          unzip -t /tmp/SnowCodeAndroid-src.zip
          unzip -q /tmp/SnowCodeAndroid-src.zip
          test -f SnowCodeAndroid/app/src/main/AndroidManifest.xml

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: SnowCodeAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowCode-v0.4-APK
          path: SnowCodeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
